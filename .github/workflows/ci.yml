name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace
        run: uv sync --all-packages
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pre-commit
        run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace
        run: uv sync --all-packages
      - name: Install pip-audit
        run: uv pip install pip-audit
      - name: Dependency audit
        run: uv run pip-audit
      - name: Tests
        run: uv run pytest --cov=apps --cov-report=term --cov-fail-under=50

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/autonomous-job-agent/package-lock.json
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/autonomous-job-agent/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/autonomous-job-agent/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/autonomous-job-agent
      - name: Syntax check
        run: |
          node --check server.mjs
          node --check src/routes.mjs
        working-directory: apps/autonomous-job-agent
