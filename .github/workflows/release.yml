name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Publish semantic release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx semantic-release publish
