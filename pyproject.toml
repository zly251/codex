[project]
name = "codex-workspace"
version = "0.1.0"
description = "Codex AI Engineering Workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.11.0,<0.12.0",
]

[tool.uv.workspace]
members = [
    "apps/autonomous-job-agent",
    "apps/desktop-agent",
    "apps/manju-system",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "apps/manga-editor-desu",
    ".venv",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["apps/desktop-agent/tests", "apps/manju-system/tests"]
addopts = "-q"
