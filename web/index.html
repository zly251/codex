<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<link rel="icon" href="data:,">
<title>JobAgent · AI 求职控制台</title>
<style>
:root {
  --bg: #09090b;
  --surface: #101014;
  --surface-2: #15151a;
  --surface-3: #1b1b21;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --text: #f4f4f5;
  --muted: #a1a1aa;
  --subtle: #6b7280;
  --accent: #4f8bff;
  --accent-2: #8b5cf6;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --cyan: #22d3ee;
  --info: #38bdf8;
  --font: "Inter", "SF Pro Display", "Segoe UI Variable Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  --radius: 12px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  overflow-x: hidden;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

a {
  color: var(--accent);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  border: 3px solid transparent;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.14);
  background-clip: padding-box;
}

.app {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 60;
  width: 248px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 22px 16px;
  border-right: 1px solid var(--border);
  background: rgba(13, 13, 16, 0.92);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px;
}

.brand-mark {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(79, 139, 255, 0.4);
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(79, 139, 255, 0.22), rgba(139, 92, 246, 0.18));
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  box-shadow: 0 8px 24px rgba(79, 139, 255, 0.16);
}

.brand-name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.01em;
}

.brand-sub {
  margin-top: 2px;
  color: var(--subtle);
  font-size: 11px;
}

.sidebar .section-label {
  margin: 0 8px 8px;
  color: var(--subtle);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sidebar > div {
  min-width: 0;
}

.nav {
  min-width: 0;
  display: grid;
  gap: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  text-align: left;
  transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
}

.nav-item svg {
  width: 17px;
  height: 17px;
  flex: 0 0 auto;
  opacity: 0.9;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.05);
  color: #fff;
}

.nav-item[aria-current="page"] {
  background: linear-gradient(135deg, rgba(79, 139, 255, 0.14), rgba(139, 92, 246, 0.1));
  color: #fff;
  box-shadow: inset 0 0 0 1px rgba(79, 139, 255, 0.22);
}

.sidebar-card {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.025);
}

.sidebar-card-label {
  color: var(--subtle);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.sidebar-card-value {
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
}

.sidebar-footer {
  margin-top: auto;
  padding: 0 8px;
  color: var(--subtle);
  font-size: 11px;
  line-height: 1.6;
}

.main {
  width: 100%;
  min-width: 0;
  margin-left: 248px;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(9, 9, 11, 0.78);
  backdrop-filter: blur(18px);
}

.topbar-title {
  min-width: 0;
}

.page-title {
  margin: 0;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0;
}

.topbar-sub {
  margin-top: 2px;
  color: var(--subtle);
  font-size: 12px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 11px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.035);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.pill .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--subtle);
}

.pill.online .dot {
  background: var(--success);
  box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
}

.pill.busy .dot {
  background: var(--warning);
  box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.12);
  animation: pulse 1.8s ease-in-out infinite;
}

.content {
  width: 100%;
  max-width: 1500px;
  min-width: 0;
  margin: 0 auto;
  padding: 24px 28px 56px;
}

.tab {
  display: none;
}

.tab.active {
  display: block;
  animation: tab-in 0.2s ease-out;
}

@keyframes tab-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes pulse {
  0%,
  100% {
    opacity: 0.75;
  }
  50% {
    opacity: 1;
  }
}

.panel {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.012));
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 16px 40px rgba(0, 0, 0, 0.22);
}

.panel + .panel {
  margin-top: 16px;
}

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
}

.panel-title {
  margin: 0;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0;
}

.panel-desc {
  margin: 4px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid var(--border-strong);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  font-size: 13px;
  font-weight: 650;
  white-space: nowrap;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.btn svg {
  width: 15px;
  height: 15px;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.09);
  border-color: rgba(255, 255, 255, 0.22);
}

.btn:active {
  transform: translateY(1px);
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #6c6cff);
  border-color: rgba(79, 139, 255, 0.5);
  color: #fff;
  box-shadow: 0 8px 24px rgba(79, 139, 255, 0.2);
}

.btn-primary:hover {
  background: linear-gradient(135deg, #5d96ff, #7d7dff);
  border-color: rgba(79, 139, 255, 0.7);
}

.btn-danger {
  background: rgba(239, 68, 68, 0.16);
  border-color: rgba(239, 68, 68, 0.35);
  color: #fca5a5;
}

.btn-danger:hover {
  background: rgba(239, 68, 68, 0.24);
}

.btn-success {
  background: rgba(34, 197, 94, 0.14);
  border-color: rgba(34, 197, 94, 0.35);
  color: #86efac;
}

.btn-success:hover {
  background: rgba(34, 197, 94, 0.22);
}

.btn-sm {
  min-height: 29px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 12px;
}

.btn[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}

.icon-btn {
  width: 34px;
  height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
}

.icon-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
}

.icon-btn svg {
  width: 15px;
  height: 15px;
}

.field {
  display: grid;
  gap: 6px;
}

.field label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  min-height: 38px;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  outline: none;
}

.field textarea {
  min-height: 84px;
  resize: vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: rgba(79, 139, 255, 0.55);
  box-shadow: 0 0 0 3px rgba(79, 139, 255, 0.12);
}

.input-sm {
  min-height: 34px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  outline: none;
}

.input-sm:focus {
  border-color: rgba(79, 139, 255, 0.55);
  box-shadow: 0 0 0 3px rgba(79, 139, 255, 0.12);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.form-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.span-2 {
  grid-column: span 2;
}

.span-3 {
  grid-column: span 3;
}

.range-pair {
  display: flex;
  align-items: center;
  gap: 6px;
}

.range-pair input {
  min-width: 0;
}

.check-line {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  color: var(--muted);
  font-size: 13px;
}

input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}

.result-line {
  color: var(--muted);
  font-size: 12px;
}

.empty-state {
  padding: 42px 24px;
  color: var(--muted);
  text-align: center;
}

.empty-state .empty-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  margin: 0 auto 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--subtle);
}

.empty-state .empty-icon svg {
  width: 20px;
  height: 20px;
}

.empty-state strong {
  display: block;
  margin-bottom: 5px;
  color: var(--text);
  font-size: 15px;
}

.empty-state span {
  font-size: 13px;
}

.empty-actions {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.status-card {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
  gap: 20px;
}

.status-card::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(135deg, rgba(79, 139, 255, 0.08), transparent 42%, rgba(139, 92, 246, 0.05));
}

.status-main {
  position: relative;
  min-width: 0;
}

.status-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.status-title {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.status-description {
  max-width: 620px;
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.status-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 22px;
}

.progress-card {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.025);
}

.progress-ring-row {
  display: flex;
  align-items: center;
  gap: 16px;
}

.ring {
  position: relative;
  width: 78px;
  height: 78px;
  flex: 0 0 auto;
}

.ring svg {
  width: 78px;
  height: 78px;
  transform: rotate(-90deg);
}

.ring .ring-track {
  fill: none;
  stroke: rgba(255, 255, 255, 0.08);
  stroke-width: 7;
}

.ring .ring-value {
  fill: none;
  stroke: url(#ringGradient);
  stroke-width: 7;
  stroke-linecap: round;
}

.ring span {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 700;
}

.progress-copy {
  min-width: 0;
}

.progress-copy strong {
  display: block;
  font-size: 13px;
}

.progress-copy span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.progress-bar {
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
}

.progress-bar i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  box-shadow: 0 0 16px rgba(79, 139, 255, 0.4);
  transition: width 0.3s ease;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin-top: 16px;
}

.metric {
  position: relative;
  min-height: 112px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 15px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.012));
}

.metric-label {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}

.metric-label svg {
  width: 14px;
  height: 14px;
  color: var(--metric-color, var(--accent));
}

.metric-value {
  font-family: var(--mono);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.metric-note {
  color: var(--subtle);
  font-size: 11px;
}

.metric-bar {
  position: absolute;
  left: 15px;
  right: 15px;
  bottom: 0;
  height: 2px;
  background: rgba(255, 255, 255, 0.06);
}

.metric-bar i {
  display: block;
  height: 100%;
  background: var(--metric-color, var(--accent));
  box-shadow: 0 0 12px var(--metric-color, var(--accent));
}

.split-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
  gap: 16px;
  margin-top: 16px;
}

.split-grid .panel {
  margin: 0;
}

.activity-list {
  display: grid;
  gap: 0;
}

.activity-item {
  position: relative;
  display: grid;
  grid-template-columns: 16px minmax(0, 1fr);
  gap: 12px;
  padding: 11px 0;
}

.activity-item:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 28px;
  bottom: -4px;
  width: 1px;
  background: var(--border);
}

.activity-dot {
  width: 8px;
  height: 8px;
  margin-top: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(79, 139, 255, 0.12);
}

.activity-dot.success {
  background: var(--success);
  box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
}

.activity-dot.warning {
  background: var(--warning);
  box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
}

.activity-dot.danger {
  background: var(--danger);
  box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
}

.activity-time {
  color: var(--subtle);
  font-family: var(--mono);
  font-size: 10px;
}

.activity-text {
  overflow: hidden;
  color: #d4d4d8;
  font-size: 12px;
  line-height: 1.55;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.funnel-row {
  display: grid;
  gap: 10px;
}

.funnel-item {
  display: grid;
  grid-template-columns: 70px minmax(0, 1fr) 42px;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}

.funnel-item strong {
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  text-align: right;
}

.funnel-track {
  height: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
}

.funnel-track i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

.jobs-layout {
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.filter-panel {
  position: sticky;
  top: 84px;
  display: grid;
  gap: 14px;
  padding: 16px;
}

.feed {
  display: grid;
  gap: 12px;
}

.job-card {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) auto;
  gap: 16px;
  align-items: start;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.032), rgba(255, 255, 255, 0.012));
  transition: border-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
}

.job-card:hover {
  border-color: rgba(79, 139, 255, 0.34);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
  transform: translateY(-1px);
}

.match-box {
  display: grid;
  justify-items: center;
  gap: 6px;
  padding-top: 2px;
}

.match-label {
  color: var(--subtle);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.job-main {
  min-width: 0;
}

.job-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.job-title {
  margin: 0;
  color: var(--text);
  font-size: 15px;
  font-weight: 750;
}

.job-company {
  color: var(--muted);
  font-size: 12px;
}

.job-meta {
  display: flex;
  align-items: center;
  gap: 8px 14px;
  flex-wrap: wrap;
  margin-top: 8px;
  color: var(--muted);
  font-size: 12px;
}

.job-meta strong {
  color: #d4d4d8;
  font-weight: 650;
}

.tag-list {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
  font-size: 11px;
}

.tag.match {
  border-color: rgba(79, 139, 255, 0.3);
  color: #93c5fd;
}

.job-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pipeline-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

.pipeline-stat {
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.025);
}

.pipeline-stat-label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.pipeline-stat-value {
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 800;
}

.board {
  display: flex;
  gap: 10px;
  align-items: start;
  overflow-x: auto;
  padding-bottom: 8px;
}

.board-column {
  flex: 0 0 260px;
  min-height: 360px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.02);
}

.board-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 4px 10px;
}

.board-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #d4d4d8;
  font-size: 12px;
  font-weight: 750;
}

.board-count {
  min-width: 22px;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  text-align: center;
}

.board-body {
  display: grid;
  gap: 8px;
}

.pipeline-card {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.035);
}

.pipeline-card h4 {
  margin: 0 0 5px;
  font-size: 13px;
  font-weight: 700;
}

.pipeline-card .company {
  color: var(--muted);
  font-size: 12px;
}

.pipeline-card .meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  color: var(--subtle);
  font-size: 11px;
}

.pipeline-card .note {
  margin-top: 8px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

.pipeline-card .actions {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
}

.pipeline-card select {
  min-width: 0;
  flex: 1;
}

.resume-layout {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.analysis-panel {
  position: sticky;
  top: 84px;
  display: grid;
  gap: 16px;
  padding: 16px;
}

.analysis-score {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.025);
}

.analysis-copy strong {
  display: block;
  font-size: 15px;
}

.analysis-copy span {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.analysis-bars {
  display: grid;
  gap: 12px;
}

.analysis-bar {
  display: grid;
  gap: 6px;
}

.analysis-bar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
}

.analysis-bar-head strong {
  color: #d4d4d8;
  font-family: var(--mono);
}

.analysis-track {
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
}

.analysis-track i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
}

.suggestion-list {
  display: grid;
  gap: 8px;
}

.suggestion {
  display: flex;
  gap: 9px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.025);
  color: var(--muted);
  font-size: 12px;
  line-height: 1.55;
}

.suggestion svg {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
  color: var(--warning);
}

.resume-main {
  display: grid;
  gap: 16px;
}

.resume-section {
  padding: 18px;
}

.resume-section .panel-head {
  margin-bottom: 12px;
}

.editor-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr)) 64px;
  gap: 10px;
  align-items: start;
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.025);
}

.editor-row .wide {
  grid-column: 1 / 4;
}

.editor-empty {
  padding: 20px;
  border: 1px dashed var(--border-strong);
  border-radius: 10px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.upload-list {
  display: grid;
  gap: 8px;
}

.resume-file {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.025);
}

.resume-file-main {
  min-width: 0;
}

.resume-file-main strong {
  display: block;
  overflow: hidden;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.resume-file-main span {
  color: var(--subtle);
  font-size: 11px;
}

.task-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
  gap: 16px;
  align-items: start;
}

.task-grid .panel {
  margin: 0;
}

.task-list {
  display: grid;
  gap: 10px;
}

.task-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.025);
}

.task-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 9px;
  background: rgba(79, 139, 255, 0.12);
  color: var(--accent);
}

.task-icon.success {
  background: rgba(34, 197, 94, 0.12);
  color: var(--success);
}

.task-icon.warning {
  background: rgba(245, 158, 11, 0.12);
  color: var(--warning);
}

.task-icon svg {
  width: 16px;
  height: 16px;
}

.task-copy {
  min-width: 0;
  flex: 1;
}

.task-copy strong {
  display: block;
  font-size: 13px;
}

.task-copy span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.log-console {
  margin-top: 16px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #08090c;
  color: #a7f3d0;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  white-space: pre-wrap;
}

.log-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  color: var(--muted);
  font-family: var(--font);
}

.log-head strong {
  color: var(--text);
}

.status-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.025);
}

.status-dot {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--subtle);
}

.status-dot.online {
  background: var(--success);
  box-shadow: 0 0 0 5px rgba(34, 197, 94, 0.1);
}

.status-dot.busy {
  background: var(--warning);
  box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.1);
}

.status-main-copy {
  min-width: 0;
  flex: 1;
}

.status-title-copy {
  font-size: 13px;
  font-weight: 700;
}

.status-sub-copy {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.progress-text {
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
}

.progress-text.is-running {
  color: var(--accent);
}

@media (max-width: 1180px) {
  .metric-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .status-card,
  .split-grid,
  .jobs-layout,
  .resume-layout,
  .task-grid {
    grid-template-columns: 1fr;
  }

  .filter-panel,
  .analysis-panel {
    position: static;
  }

  .pipeline-summary {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 900px) {
  .app {
    display: block;
  }

  .sidebar {
    position: sticky;
    top: 0;
    width: 100%;
    height: auto;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    flex: 0 0 auto;
  }

  .brand-sub,
  .sidebar .section-label,
  .sidebar-card,
  .sidebar-footer {
    display: none;
  }

  .nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav::-webkit-scrollbar {
    display: none;
  }

  .nav-item {
    flex: 0 0 auto;
    width: auto;
    white-space: nowrap;
  }

  .main {
    margin-left: 0;
  }

  .topbar {
    padding: 0 16px;
  }

  .content {
    padding: 18px 14px 40px;
  }

  .form-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .span-3 {
    grid-column: span 2;
  }

  .job-card {
    grid-template-columns: 70px minmax(0, 1fr);
  }

  .job-actions {
    grid-column: 1 / -1;
  }

  .editor-row {
    grid-template-columns: 1fr;
  }

  .editor-row .wide {
    grid-column: auto;
  }
}

@media (max-width: 600px) {
  .topbar-sub,
  .topbar-actions .btn {
    display: none;
  }

  .metric-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .pipeline-summary {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .span-2,
  .span-3 {
    grid-column: auto;
  }

  .status-card {
    gap: 14px;
  }

  .status-title {
    font-size: 20px;
  }

  .job-card {
    grid-template-columns: 1fr;
  }

  .match-box {
    justify-items: start;
    grid-auto-flow: column;
    align-items: center;
  }

  .pipeline-summary {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">J</div>
      <div>
        <div class="brand-name">JobAgent</div>
        <div class="brand-sub">AI 求职控制台</div>
      </div>
    </div>
    <div>
      <div class="section-label">工作台</div>
      <nav class="nav" aria-label="主导航">
        <button class="nav-item" data-tab="dashboard" type="button">Agent 状态</button>
        <button class="nav-item" data-tab="jobs" type="button">岗位推荐</button>
        <button class="nav-item" data-tab="pipeline" type="button">投递 Pipeline</button>
        <button class="nav-item" data-tab="resume" type="button">简历 AI</button>
        <button class="nav-item" data-tab="tasks" type="button">任务监控</button>
      </nav>
    </div>
    <div class="sidebar-card">
      <div class="sidebar-card-label">运行模式</div>
      <div class="sidebar-card-value"><span id="sidebar-mode">本地 Agent</span><span class="status-dot" id="sidebar-dot"></span></div>
    </div>
    <div class="sidebar-footer">
      本地运行 · 数据保存在 portable<br>仅控制本机求职流程
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <div class="page-title" id="page-title">Agent 状态</div>
        <div class="topbar-sub" id="topbar-sub">AI 求职 Agent</div>
      </div>
      <div class="topbar-actions">
        <span class="pill" id="global-status"><span class="dot"></span><span class="pill-label">未连接</span></span>
        <button class="btn btn-sm" type="button" onclick="refreshStatus()">刷新状态</button>
      </div>
    </header>
    <div class="content">
      <div id="tab-dashboard" class="tab active"></div>
      <div id="tab-jobs" class="tab"></div>
      <div id="tab-pipeline" class="tab"></div>
      <div id="tab-resume" class="tab"></div>
      <div id="tab-tasks" class="tab"></div>
    </div>
  </main>
</div>

<script>
// ─── 状态 ───
var profile = null;
var bossConnected = false;
var applyRunning = false;
var _logLines = [];
var _lastServerLogId = 0;
var _pollTimer = null;
var _statusBusy = false;
var _pipelineLoaded = false;

var TAB_LABELS = {
  dashboard: "Agent 状态",
  jobs: "岗位推荐",
  pipeline: "投递 Pipeline",
  resume: "简历 AI",
  tasks: "任务监控"
};

function icon(name, cls) {
  var paths = {
    home: '<path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1v-10.5Z"/>',
    briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    columns: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/>',
    file: '<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2Z"/><polyline points="14 2 14 8 20 8"/>',
    activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
    send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    play: '<polygon points="6 3 20 12 6 21 6 3"/>',
    stop: '<rect x="5" y="5" width="14" height="14" rx="2"/>',
    refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>',
    sparkles: '<path d="m12 3 1.9 5.7L19.6 10l-5.7 1.9L12 17.6l-1.9-5.7L4.4 10l5.7-1.9L12 3Z"/>',
    plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
    chevron: '<polyline points="9 18 15 12 9 6"/>',
    zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/>',
    user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    check: '<polyline points="20 6 9 17 4 12"/>',
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>'
  };
  return '<svg class="' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (paths[name] || "") + "</svg>";
}

function log(msg) {
  _logLines.push(new Date().toLocaleTimeString() + "  " + msg);
  if (_logLines.length > 100) _logLines.shift();
  var la = document.getElementById("log-area");
  if (la) la.textContent = _logLines.slice(-30).join("\n");
}

async function api(path, opts) {
  var r = await fetch(path, opts || {});
  var text = await r.text();
  try {
    return JSON.parse(text);
  } catch (e) {
    return { ok: false, error: text || ("HTTP " + r.status) };
  }
}

function escapeHtml(value) {
  return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function escAttr(value) {
  return escapeHtml(value);
}

function setPageTitle(name) {
  var t = document.getElementById("page-title");
  if (t) t.textContent = name || "";
  var sub = document.getElementById("topbar-sub");
  if (sub) sub.textContent = "AI 求职 Agent";
}

// ─── 导航 ───
function switchTab(name) {
  document.querySelectorAll(".nav-item").forEach(function(n) {
    var active = n.getAttribute("data-tab") === name;
    n.classList.toggle("active", active);
    if (active) n.setAttribute("aria-current", "page");
    else n.removeAttribute("aria-current");
  });
  document.querySelectorAll(".tab").forEach(function(t) {
    t.classList.toggle("active", t.id === "tab-" + name);
  });
  setPageTitle(TAB_LABELS[name] || name);
  try { localStorage.setItem("job-agent-tab", name); } catch (e) {}
  loadTab(name);
}

function goTab(name) {
  var nav = document.querySelector('.nav-item[data-tab="' + name + '"]');
  if (nav) nav.click();
}

document.querySelectorAll(".nav-item").forEach(function(el) {
  el.addEventListener("click", function() {
    switchTab(this.getAttribute("data-tab"));
  });
});

function loadTab(name) {
  if (name === "dashboard") loadDashboard();
  else if (name === "jobs") loadJobs();
  else if (name === "pipeline") loadPipeline();
  else if (name === "resume") loadResume();
  else if (name === "tasks") loadTasks();
}

// ─── 通用组件 ───
function ringHtml(pct) {
  var p = Math.max(0, Math.min(100, Number(pct) || 0));
  var r = 32;
  var c = 2 * Math.PI * r;
  var off = c * (1 - p / 100);
  return '<div class="ring"><svg viewBox="0 0 78 78"><defs><linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f8bff"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs><circle class="ring-track" cx="39" cy="39" r="' + r + '"></circle><circle class="ring-value" cx="39" cy="39" r="' + r + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"></circle></svg><span>' + p + '%</span></div>';
}

function statusTone(bs) {
  if (!bs.browserConnected) return { dot: "", label: "未连接", title: "浏览器未连接" };
  if (bs.running) return { dot: "busy", label: "运行中", title: "自动化任务运行中" };
  return { dot: "online", label: "已连接", title: "Agent 已就绪" };
}

function toList(value) {
  if (Array.isArray(value)) return value.filter(Boolean);
  return String(value || "").split(/[,，\s]+/).filter(Boolean);
}

function setSidebarStatus(connected) {
  var dot = document.getElementById("sidebar-dot");
  var mode = document.getElementById("sidebar-mode");
  if (dot) dot.className = "status-dot" + (connected ? " online" : "");
  if (mode) mode.textContent = connected ? "Agent 在线" : "本地待机";
}

// ─── Agent 状态 ───
async function loadDashboard() {
  var d = await api("/api/stats");
  var bs = await api("/api/boss/status").catch(function() { return {}; });
  bossConnected = bs.browserConnected || false;
  var tone = statusTone(bs);
  var totalApps = d.totalApplications || 0;
  var pct = function(v) { return totalApps ? Math.round(((v || 0) / totalApps) * 100) : 0; };
  var progress = bs.running && bs.progress && bs.progress.total
    ? Math.round((bs.progress.current / bs.progress.total) * 100)
    : (bs.running ? 42 : 0);
  var progressLabel = bs.running && bs.progress && bs.progress.total
    ? bs.progress.current + " / " + bs.progress.total + " " + (bs.progress.step || "")
    : (bs.running ? "正在执行自动化任务" : "等待新任务");

  var metrics = [
    { label: "职位池", value: d.totalJobs || 0, note: "已收录岗位", cls: "metric-accent", icon: "briefcase", p: Math.min(100, d.totalJobs || 0) },
    { label: "有效岗位", value: d.activeJobs || 0, note: "可沟通", cls: "metric-success", icon: "zap", p: d.activeJobs && d.totalJobs ? Math.round(d.activeJobs / d.totalJobs * 100) : 0 },
    { label: "投递记录", value: d.totalApplications || 0, note: "已发起沟通", cls: "metric-info", icon: "send", p: Math.min(100, d.totalApplications || 0) },
    { label: "回复率", value: (d.conversion && d.conversion.replyRate || 0) + "%", note: "已回复占比", cls: "metric-violet", icon: "activity", p: d.conversion && d.conversion.replyRate || 0 },
    { label: "Offer", value: d.offers || 0, note: "当前成果", cls: "metric-success", icon: "check", p: pct(d.offers) }
  ];
  var metricHtml = metrics.map(function(m, i) {
    return '<div class="metric" style="--metric-color:var(--' + m.cls.replace("metric-", "") + ')">' +
      '<div class="metric-label">' + icon(m.icon) + m.label + '</div>' +

function currentApplyOptions(extra) {
  function el(id) { return document.getElementById(id); }
  function num(id, dflt) { var v = parseInt((el(id) || {}).value); return isNaN(v) ? dflt : v; }
  var o = {
    city: (el("filter-city") || {}).value || "",
    district: (el("filter-district") || {}).value || "",
    keywords: (el("filter-keywords") || {}).value || (profile && profile.skills) || "",
    minMatch: num("min-match", 30) / 100,
    delayMin: num("delay-min", 8),
    delayMax: num("delay-max", 25),
    greeting: (el("greeting") || {}).value || (profile && profile.greeting) || "",
    skipApplied: !el("skip-applied") || document.getElementById("skip-applied").checked
  };
  return Object.assign(o, extra || {});
}

async function quickApply(n) {
  if (applyRunning) {
    log("投递已在进行中");
    return;
  }
  applyRunning = true;
  log("开始投递 " + n + " 份...");
  try {
    var r = await fetch("/api/boss/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(currentApplyOptions({ limit: n })) });
    var d = await r.json();
    if (d.ok) log("完成: 成功 " + d.applied + " / 失败 " + (d.failed || 0) + " / 跳过 " + (d.skippedApplied || 0) + " / 共 " + d.total);
    else log("失败: " + (d.error || ""));
  } catch (e) {
    log("错误: " + e.message);
  }
  applyRunning = false;
  loadDashboard();
}

async function stopApply() {
  try {
    await fetch("/api/boss/stop", { method: "POST" });
    log("已发送停止指令");
    applyRunning = false;
  } catch (e) {}
}

var STATUS_NAMES = { pending: "待处理", viewed: "已查看", replied: "已回复", interview: "面试中", offer: "Offer", rejected: "不合适", withdrawn: "已撤回" };
var PIPELINE_ORDER = ["pending", "viewed", "replied", "interview", "offer", "rejected", "withdrawn"];

async function loadPipeline() {
  var d = await api("/api/applications");
  var apps = d.applications || [];
  _pipelineLoaded = true;
  var el = document.getElementById("tab-pipeline");
  var grouped = {};
  PIPELINE_ORDER.forEach(function(s) { grouped[s] = []; });
  apps.forEach(function(a) {
    var s = STATUS_NAMES[a.status] ? a.status : "pending";
    if (!grouped[s]) grouped[s] = [];
    grouped[s].push(a);
  });
  var total = apps.length;
  var summary = PIPELINE_ORDER.map(function(s) {
    var count = (grouped[s] || []).length;
    return '<div class="pipeline-stat"><div class="pipeline-stat-label">' + STATUS_NAMES[s] + '</div><div class="pipeline-stat-value">' + count + '</div></div>';
  }).join("");

  var board = PIPELINE_ORDER.map(function(s) {
    var items = grouped[s] || [];
    var cards = items.map(function(a) {
      return '<div class="pipeline-card">' +
        '<h4>' + escapeHtml(a.jobTitle || "-") + '</h4>' +
        '<div class="company">' + escapeHtml(a.companyName || "-") + '</div>' +
        '<div class="meta"><span>' + escapeHtml(a.salary || "-") + '</span><span>' + escapeHtml((a.time || "").slice(0, 10)) + '</span></div>' +
        (a.notes ? '<div class="note">' + escapeHtml(a.notes) + '</div>' : "") +
        '<div class="actions">' +
        '<select class="input-sm" onchange="updateAppStatus(' + a.id + ',this.value)">' +
        '<option value="">改状态</option>' +
        Object.keys(STATUS_NAMES).map(function(k) { return '<option value="' + k + '"' + (k === a.status ? " selected" : "") + '>' + STATUS_NAMES[k] + '</option>'; }).join("") +
        '</select>' +
        '<button class="icon-btn" type="button" title="删除投递" onclick="deleteApp(' + a.id + ')">' + icon("trash") + '</button>' +
        '</div></div>';
    }).join("") || '<div class="empty-state"><span>暂无记录</span></div>';
    return '<div class="board-column"><div class="board-head"><div class="board-title">' + STATUS_NAMES[s] + '</div><span class="board-count">' + items.length + '</span></div><div class="board-body">' + cards + '</div></div>';
  }).join("");

  el.innerHTML =
    '<div class="pipeline-summary">' + summary + '</div>' +
    (total ? "" : '<section class="panel"><div class="empty-state"><div class="empty-icon">' + icon("columns") + '</div><strong>投递 Pipeline 还是空的</strong><span>先搜索并投递职位，反馈会自动进入对应阶段。</span><div class="empty-actions"><button class="btn btn-primary" type="button" onclick="goTab(\'tasks\')">去启动任务</button><button class="btn" type="button" onclick="loadPipeline()">刷新</button></div></div></section>') +
    '<div class="board">' + board + '</div>';
}

async function updateAppStatus(id, status) {
  if (!status) return;
  try {
    var r = await fetch("/api/applications/" + id, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: status }) });

    { key: "period", label: "时间" },
    { key: "content", label: "工作内容", area: true, wide: true }

    { key: "period", label: "时间" },
    { key: "content", label: "说明", area: true, wide: true }

};

function editorOptions(values, current) {
  return values.map(function(v) {
    return '<option value="' + escAttr(v) + '"' + (String(v) === String(current || "") ? " selected" : "") + ">" + escapeHtml(v || "请选择") + "</option>";
  }).join("");
}

function editorFieldHtml(prefix, idx, field, value) {
  var id = prefix + "-" + idx + "-" + field.key;
  var label = '<label for="' + id + '">' + field.label + "</label>";
  var cls = "field" + (field.wide ? " wide" : "");
  if (field.area) {
    return '<div class="' + cls + '">' + label + '<textarea id="' + id + '" data-editor-row="' + prefix + '" data-editor-idx="' + idx + '" data-editor-key="' + field.key + '">' + escapeHtml(value || "") + "</textarea></div>";
  }
  return '<div class="' + cls + '">' + label + '<input id="' + id + '" data-editor-row="' + prefix + '" data-editor-idx="' + idx + '" data-editor-key="' + field.key + '" value="' + escAttr(value || "") + '"></div>';
}

function renderEditorRows(prefix) {
  var rows = resumeEditorData[prefix] || [];
  var box = document.getElementById("re-" + prefix);
  if (!box) return;
  if (!rows.length) {
    box.innerHTML = '<div class="editor-empty">还没有记录，点击右上角添加。</div>';
    return;
  }
  box.innerHTML = rows.map(function(item, idx) {
    var fields = EDITOR_FIELDS[prefix].map(function(f) {
      return editorFieldHtml(prefix, idx, f, item[f.key] || "");
    }).join("");
    return '<div class="editor-row">' + fields + '<button class="icon-btn" type="button" title="删除" onclick="removeEditorRow(\'' + prefix + '\',' + idx + ')">' + icon("trash") + '</button></div>';
  }).join("");
}

function collectEditorRows(prefix) {
  var map = {};
  document.querySelectorAll('[data-editor-row="' + prefix + '"]').forEach(function(el) {
    var idx = Number(el.getAttribute("data-editor-idx"));
    var key = el.getAttribute("data-editor-key");
    if (!map[idx]) map[idx] = {};
    map[idx][key] = el.value.trim();
  });
  return Object.keys(map).sort(function(a, b) { return Number(a) - Number(b); }).map(function(idx) {
    return map[idx];
  });
}

function addEditorRow(prefix) {
  resumeEditorData[prefix] = collectEditorRows(prefix);
  resumeEditorData[prefix].push({});
  renderEditorRows(prefix);
}

function removeEditorRow(prefix, idx) {
  var rows = collectEditorRows(prefix);
  rows.splice(idx, 1);
  resumeEditorData[prefix] = rows;
  renderEditorRows(prefix);
}

function setEditorMsg(msg) {
  var el = document.getElementById("re-msg");
  if (el) el.textContent = msg;
}

    '<div class="analysis-bar"><div class="analysis-bar-head"><span>技能覆盖</span><strong>' + Math.round(skillPct) + '%</strong></div><div class="analysis-track"><i style="width:' + skillPct + '%"></i></div></div>' +
    '<div class="analysis-bar"><div class="analysis-bar-head"><span>工作经历</span><strong>' + (r.work || []).length + ' 条</strong></div><div class="analysis-track"><i style="width:' + workScore + '%"></i></div></div>' +
    '<div class="analysis-bar"><div class="analysis-bar-head"><span>项目经历</span><strong>' + (r.projects || []).length + ' 条</strong></div><div class="analysis-track"><i style="width:' + projectScore + '%"></i></div></div>' +
    '</div>' +
    '<div><h4 class="panel-title">优化建议</h4><div class="suggestion-list" style="margin-top:10px">' + suggestionHtml + '</div></div>' +
    '</aside>';

  var fileHtml = '<div class="upload-list">';

    fileHtml += '<div class="resume-file"><div class="resume-file-main"><strong>' + escapeHtml(f.name || "-") + '</strong><span>' + escapeHtml((f.createdAt || "").slice(0, 10)) + '</span></div><button class="icon-btn" type="button" title="删除" onclick="deleteResume(' + f.id + ')">' + icon("trash") + '</button></div>';
  });

    '<section class="panel resume-section">' +
    '<div class="panel-head"><div><h3 class="panel-title">简历 AI 分析</h3><p class="panel-desc">根据当前档案生成建议，保存后同步到投递</p></div></div>' +
    '<div class="form-grid">' +
    '<div class="field"><label for="re-name">姓名</label><input id="re-name" value="' + escAttr(r.name || "") + '"></div>' +
    '<div class="field"><label for="re-target">目标岗位</label><input id="re-target" value="' + escAttr(r.targetRole || "") + '"></div>' +

async function saveResumeEditorData() {
  var data = resumeEditorData || {};
  data.name = document.getElementById("re-name").value;
  data.targetRole = document.getElementById("re-target").value;
  data.status = document.getElementById("re-status").value;
  data.phone = document.getElementById("re-phone").value;
  data.email = document.getElementById("re-email").value;
  data.city = document.getElementById("re-city").value;
  data.education = document.getElementById("re-education").value;
  data.experience = document.getElementById("re-experience").value;
  data.summary = document.getElementById("re-summary").value;
  data.skills = document.getElementById("re-skills").value;
  data.greeting = document.getElementById("re-greeting").value;
  data.work = collectEditorRows("work");
  data.projects = collectEditorRows("projects");
  data.educationList = collectEditorRows("educationList");
  try {
    var r = await api("/api/resume/editor", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
    if (r.ok) {
      resumeEditorData = r.resume;
      setEditorMsg("已保存");
      var p = await api("/api/profile").catch(function() { return {}; });
      if (p && p.name) profile = p;
      return true;
    }
    setEditorMsg("保存失败: " + (r.error || ""));
    return false;
  } catch (e) {
    setEditorMsg("保存失败: " + e.message);
    return false;
  }
}

async function exportResume(format) {
  setEditorMsg("正在生成...");
  var ok = await saveResumeEditorData();
  if (!ok) return;
  try {
    var a = document.createElement("a");
    a.href = "/api/resume/export?format=" + encodeURIComponent(format);
    a.download = "resume." + format;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setEditorMsg("已生成");
  } catch (e) {
    setEditorMsg("生成失败: " + e.message);
  }
}

async function uploadResume() {
  var file = document.getElementById("resume-file").files[0];
  if (!file) return;
  log("上传简历: " + file.name);
  var reader = new FileReader();
  reader.onload = async function() {
    var base64 = reader.result.split(",")[1];
    try {
      var r = await api("/api/resumes/upload", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fileName: file.name, fileData: base64 }) });
      if (r.ok) {
        log("上传成功, 识别技能: " + (r.skills || []).join(","));
        loadResume();
      } else {
        log("上传失败: " + (r.error || ""));
      }
    } catch (e) {
      log("上传错误: " + e.message);
    }
  };
  reader.readAsDataURL(file);
}

async function deleteResume(id) {
  await fetch("/api/resumes/" + id, { method: "DELETE" });
  log("已删除简历 #" + id);
  loadResume();
}

async function bossConnect() {
  log("启动/连接 Edge...");
  try {
    var r = await api("/api/boss/launch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ host: "127.0.0.1", port: 9222 }) });
    if (r.ok) {
      log(r.message || "连接成功!");
      bossConnected = true;
    } else {
      log("自动启动失败: " + (r.error || "") + "，尝试直接连接");
      var r2 = await api("/api/boss/connect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ host: "127.0.0.1", port: 9222 }) });
      if (r2.ok) {
        log("连接成功!");
        bossConnected = true;
      } else {
        log("连接失败: " + (r2.error || ""));
        bossConnected = false;
      }
    }
  } catch (e) {
    log("连接错误: " + e.message);
    bossConnected = false;
  }
  setSidebarStatus(bossConnected);
  await pollStatusOnce();
}

async function bossApply() {
  var l = parseInt(document.getElementById("limit").value) || 20;
  var o = currentApplyOptions({ limit: l });
  if (o.delayMax < o.delayMin) o.delayMax = o.delayMin;
  var city = o.city || "全部";
  var district = o.district || "";
  var keywords = o.keywords || "全部";
  var dm = o.delayMin;
  var dx = o.delayMax;
  var el = document.getElementById("ar");
  el.textContent = "投递中...";
  log("开始投递: " + city + " " + district + " " + keywords + " 最多" + l + "份，随机延迟 " + dm + "-" + dx + " 秒");
  try {
    var r = await fetch("/api/boss/apply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) });
    var d = await r.json();
    if (d.ok) {
      el.innerHTML = "&#x2713; 成功 <b>" + d.applied + "</b> / 失败 <b>" + (d.failed || 0) + "</b> / 跳过 <b>" + (d.skippedApplied || 0) + "</b> / 共 <b>" + d.total + "</b>";

      el.textContent = "失败: " + (d.error || "");
      log("投递失败: " + (d.error || ""));

  } catch (e) {
    el.textContent = "失败: " + e.message;
    log("投递错误: " + e.message);
  }

// ─── 实时状态轮询 ───
async function pollStatusOnce() {
  if (_statusBusy) return;
  _statusBusy = true;
  try {
    var bs = await api("/api/boss/status").catch(function() { return {}; });
    bossConnected = bs.browserConnected || false;
    setSidebarStatus(bossConnected);

    var gs = document.getElementById("global-status");
    if (gs) {
      gs.className = "pill" + (bossConnected ? (bs.running ? " busy" : " online") : "");
      var label = gs.querySelector(".pill-label");
      if (label) label.textContent = bossConnected ? (bs.running ? "自动化运行中" : "已连接") : "未连接";
    }

    var bt = document.getElementById("browser-txt");
    if (bt) bt.textContent = bossConnected ? "浏览器已连接" : "浏览器未连接";
    var dot = document.querySelector(".status-card .status-dot");
    if (dot) dot.className = "status-dot" + (bossConnected ? (bs.running ? " busy" : " online") : "");
    var prog = document.getElementById("prog");
    if (prog) {
      if (bs.running && bs.progress && bs.progress.total) {
        prog.textContent = "进度 " + bs.progress.current + "/" + bs.progress.total + " " + (bs.progress.step || "");
        prog.className = "progress-text is-running";
      } else if (bs.running) {
        prog.textContent = "自动化运行中...";
        prog.className = "progress-text is-running";
      } else {
        prog.textContent = "空闲";
        prog.className = "progress-text";
      }
    }
    if (bs.logs && bs.logs.length) {
      var la = document.getElementById("log-area");
      if (la) {
        var newOnes = bs.logs.filter(function(l) { return l.id > _lastServerLogId; });
        if (newOnes.length) {
          _lastServerLogId = bs.logs[bs.logs.length - 1].id;
          var lines = newOnes.map(function(l) { return new Date(l.t).toLocaleTimeString() + "  " + l.msg; });
          _logLines = _logLines.concat(lines);
          if (_logLines.length > 100) _logLines = _logLines.slice(-100);
          la.textContent = _logLines.slice(-40).join("\n");
        }
      }
    }
  } catch (e) {}
  _statusBusy = false;
}

function startPolling() {
  if (_pollTimer) return;
  _pollTimer = setInterval(pollStatusOnce, 1500);
}

// ─── Init ───
(async function() {
  try {
    var p = await api("/api/profile");
    if (p && p.name) profile = p;
  } catch (e) {}
  var initialTab = "dashboard";
  try {
    var saved = localStorage.getItem("job-agent-tab");
    if (saved && TAB_LABELS[saved]) initialTab = saved;
  } catch (e) {}
  await refreshStatus();
  switchTab(initialTab);
  startPolling();
})();
</script>
