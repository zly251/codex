<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Douyin Agent</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f0f1a;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .header{padding:20px 24px 12px;border-bottom:1px solid #1e1e32;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .header h1{font-size:18px;font-weight:600;color:#e8e8f0}
  .header .sub{font-size:12px;color:#666;margin-left:12px}
  .api-row{padding:10px 24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #1e1e32;flex-shrink:0}
  .api-row label{font-size:13px;color:#888;white-space:nowrap}
  .api-row input{flex:1;max-width:380px;background:#1a1a2e;border:1px solid #2a2a4e;border-radius:8px;padding:8px 14px;color:#e0e0e0;font-size:13px;outline:none;transition:border-color .2s}
  .api-row input:focus{border-color:#4fc3f7}
  .main{flex:1;display:flex;flex-direction:column;min-height:0;padding:16px 24px}
  .input-row{display:flex;gap:8px;margin-bottom:16px;flex-shrink:0}
  .input-row input{flex:1;background:#1a1a2e;border:1px solid #2a2a4e;border-radius:10px;padding:12px 18px;color:#e0e0e0;font-size:14px;outline:none;transition:border-color .2s}
  .input-row input:focus{border-color:#4fc3f7}
  .input-row button{background:#4fc3f7;color:#0f0f1a;border:none;border-radius:10px;padding:0 28px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap}
  .input-row button:hover{opacity:.85}
  .input-row button:disabled{opacity:.4;cursor:not-allowed}
  .output-wrap{flex:1;background:#12121e;border:1px solid #1e1e32;border-radius:12px;overflow-y:auto;padding:16px 20px;font-family:"SF Mono","Fira Code","Cascadia Code",monospace;font-size:13px;line-height:1.7}
  .output-wrap::-webkit-scrollbar{width:6px}
  .output-wrap::-webkit-scrollbar-track{background:transparent}
  .output-wrap::-webkit-scrollbar-thumb{background:#2a2a4e;border-radius:3px}
  .line{padding:2px 0;white-space:pre-wrap;word-break:break-all}
  .line.cmd{color:#4fc3f7;font-weight:600}
  .line.done{color:#4caf50}
  .line.err{color:#ef5350}
  .line.info{color:#e0e0e0}
  .placeholder{color:#444;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-size:14px;pointer-events:none}
  .placeholder small{display:block;color:#333;font-size:12px;margin-top:6px}
  .status-bar{padding:6px 24px;border-top:1px solid #1e1e32;flex-shrink:0;display:flex;justify-content:space-between;font-size:11px;color:#555}
  .output-wrap{position:relative}
  a{color:#4fc3f7;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="header"><div style="display:flex;align-items:center;gap:8px"><h1>Douyin Agent</h1><span class="sub">AI 短视频生成 + 发布</span></div></div>
<div class="api-row"><label for="api_key">API Key</label><input id="api_key" type="password" placeholder="sk-..." value=""></div>
<div class="main">
  <div class="input-row"><input id="cmd_input" type="text" placeholder='输入 "topic 主题" 或 "upload" 后回车' autofocus><button id="run_btn" onclick="run()">发送</button></div>
  <div class="output-wrap" id="output"><div class="placeholder" id="placeholder">输入命令开始探索全局<br><small>例如：topic 今日热点 &mdash; 自动检索、生成脚本、合成视频、上传抖音</small></div></div>
</div>
<div class="status-bar"><span id="status_idle">就绪</span><span id="status_info">v0.1 MVP</span></div>
<script>
let currentTaskId=null;let apiKeySaved=localStorage.getItem("douyin_agent_apikey")||"";if(apiKeySaved)document.getElementById("api_key").value=apiKeySaved;document.getElementById("api_key").addEventListener("input",function(){localStorage.setItem("douyin_agent_apikey",this.value)});document.getElementById("cmd_input").addEventListener("keydown",function(e){if(e.key==="Enter"&&!document.getElementById("run_btn").disabled)run()});function log(text,cls){var out=document.getElementById("output");var ph=document.getElementById("placeholder");if(ph)ph.remove();var div=document.createElement("div");div.className="line "+cls;div.textContent=text;out.appendChild(div);out.scrollTop=out.scrollHeight}function run(){var cmd=document.getElementById("cmd_input").value.trim();var api_key=document.getElementById("api_key").value.trim();if(!cmd)return;if(!api_key){log("请输入 API Key","err");return}var btn=document.getElementById("run_btn");btn.disabled=true;document.getElementById("status_idle").textContent="运行中...";log("> "+cmd,"cmd");fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({command:cmd,api_key:api_key})}).then(function(r){return r.json()}).then(function(data){currentTaskId=data.task_id;var es=new EventSource("/api/stream/"+currentTaskId);es.onmessage=function(e){var d=JSON.parse(e.data);if(d.done){es.close();currentTaskId=null;btn.disabled=false;document.getElementById("status_idle").textContent="就绪";return}if(d.log){var cls="info";if(d.log.startsWith("[error]"))cls="err";else if(d.log.startsWith("[done]"))cls="done";log(d.log,cls)}};es.onerror=function(){es.close();btn.disabled=false;document.getElementById("status_idle").textContent="就绪"}}).catch(function(err){log("[error] "+err,"err");btn.disabled=false;document.getElementById("status_idle").textContent="就绪"})}
</script>
</body>
</html>
